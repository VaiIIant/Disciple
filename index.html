<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Quêtes</title>
<meta name="description" content="Quêtes quotidiennes façon jeu de rôle : apprendre, bouger, lire, prier… et monter de niveau.">
<meta name="theme-color" content="#12131C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quêtes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concept : un « livre de quêtes » nocturne, une colonne de téléphone, l'or réservé à la progression. */
:root {
  --bg: #12131C;
  --bg-haut: #1D1B2E;
  --carte: #1C1E2B;
  --carte-2: #23202F;
  --releve: #262338;
  --bord: #2C2F42;
  --bord-fort: #3A3D52;
  --texte: #EDEEF4;
  --doux: #A7ACBF;
  --pale: #8F94A8;
  --eteint: #5A5E78;
  --or: #E3B34C;
  --or-fonce: #B9842C;
  --or-clair: #F2CD7A;
  --sur-or: #12131C;
  --flamme: #F6B48C;
  --rouge: #FF8A80;
  --rouge-f: #4A2A2E;
  --force: #FF9F7A;  --force-f: #3A2620;
  --savoir: #8CC4FF; --savoir-f: #1F2D40;
  --esprit: #C7B6FF; --esprit-f: #2A2540;
  --vitalite: #7FDCCB; --vitalite-f: #1B3236;
  --discipline: #F2A7C3; --discipline-f: #3A2232;
  --f-titre: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-texte: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --sat: 0px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--texte); }
body { margin: 0; font-family: var(--f-texte); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-titre); text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.gouttiere { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vue { display: flex; flex-direction: column; gap: 16px; }

/* ---------- en-tête du héros ---------- */
.entete { background: linear-gradient(180deg, var(--bg-haut) 0%, var(--bg) 100%); padding-top: calc(var(--sat) + 22px); padding-bottom: 6px; display: flex; flex-direction: column; gap: 16px; }
.ligne-heros { display: flex; align-items: center; gap: 14px; }
.blason { width: 64px; height: 64px; border-radius: 18px; background: var(--releve); border: 2px solid var(--or); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
.blason small { font-size: 10px; letter-spacing: .12em; color: #C9CCDA; text-transform: uppercase; }
.blason b { font-family: var(--f-titre); font-size: 26px; line-height: 1; color: var(--or); }
.qui { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.qui span { font-size: 13px; color: var(--doux); }
.qui h1 { font-size: 21px; letter-spacing: .02em; }
.pastille-serie { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 10px; border-radius: 14px; background: var(--releve); color: var(--flamme); font-size: 12px; font-weight: 700; border: 0; }
.xp { display: flex; flex-direction: column; gap: 6px; }
.xp-haut { display: flex; justify-content: space-between; font-size: 12px; color: var(--doux); }
.xp-haut strong { color: var(--texte); }
.barre { height: 10px; border-radius: 6px; background: var(--releve); overflow: hidden; }
.barre i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--or-fonce), var(--or)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.xp-bas { font-size: 12px; color: var(--doux); }

/* ---------- quêtes ---------- */
.titre-section { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.titre-section h2 { font-size: 19px; letter-spacing: .04em; }
.titre-section span { font-size: 13px; color: var(--doux); }
.titre-section span strong { color: var(--or); }
.moment { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pale); margin: 6px 0 -4px 2px; }
.liste { display: flex; flex-direction: column; gap: 8px; }
.quete { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--carte); border: 1px solid var(--bord); position: relative; transition: transform .15s ease, border-color .2s; }
.quete.rare { background: var(--carte-2); border-color: var(--or); }
.quete.epique { background: var(--carte-2); border-color: var(--esprit); }
.quete:active { transform: scale(.985); }
.tuile { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.corps { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
.nom { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.detail { font-size: 12px; color: var(--doux); }
.fait .nom { color: var(--doux); text-decoration: line-through; }
.fait .detail, .fait .gain { color: var(--pale); }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--sur-or); background: var(--or); padding: 2px 6px; border-radius: 6px; text-decoration: none; display: inline-block; }
.tag.epique { background: var(--esprit); }
.gain { font-size: 13px; font-weight: 700; color: var(--or); white-space: nowrap; }
.coche { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--eteint); background: transparent; padding: 0; flex: none; display: flex; align-items: center; justify-content: center; }
.fait .coche, .coche[aria-pressed=true] { background: var(--or); border-color: var(--or); }
.compteur { display: flex; align-items: center; gap: 4px; flex: none; }
.compteur button { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--releve); display: flex; align-items: center; justify-content: center; padding: 0; }
.compteur output { min-width: 46px; text-align: center; font-size: 13px; font-weight: 700; }
.mini { height: 4px; border-radius: 3px; background: var(--releve); margin-top: 5px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--or); border-radius: 3px; transition: width .3s; }

.surprise { border: 1px dashed var(--or); background: var(--carte); }
.surprise .etiquette { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--or); }
.lien-bouton { border: 0; background: none; color: var(--doux); font-size: 12px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.coffre { padding: 14px; border-radius: 16px; background: var(--releve); display: flex; align-items: center; gap: 12px; }
.coffre .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.coffre .txt b { font-size: 14px; }
.coffre .txt span { font-size: 12px; color: var(--doux); }
.coffre.pret { border: 1px solid var(--or); animation: lueur 2.4s ease-in-out infinite; }
@keyframes lueur { 50% { box-shadow: 0 0 22px rgba(227, 179, 76, .35); } }
.btn-or { border: 0; border-radius: 12px; background: var(--or); color: var(--sur-or); font-weight: 700; padding: 10px 14px; min-height: 44px; }
.btn { border: 1px solid var(--bord-fort); border-radius: 12px; background: var(--releve); color: var(--texte); font-weight: 600; padding: 10px 14px; min-height: 44px; }
.btn.danger { color: var(--rouge); border-color: #5A3036; }
.vide { padding: 28px 18px; border-radius: 16px; border: 1px dashed var(--bord-fort); text-align: center; color: var(--doux); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* ---------- héros ---------- */
.portrait { padding-top: calc(var(--sat) + 26px); padding-bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: radial-gradient(circle at 50% 30%, #2B2545 0%, var(--bg) 70%); text-align: center; }
.embleme { width: 104px; height: 104px; border-radius: 50%; border: 3px solid var(--or); background: var(--carte); display: flex; align-items: center; justify-content: center; position: relative; }
.embleme b { position: absolute; bottom: -10px; font-family: var(--f-titre); font-size: 14px; background: var(--or); color: var(--sur-or); border-radius: 10px; padding: 2px 10px; }
.portrait h1 { font-size: 24px; margin-top: 8px; }
.portrait .sous { font-size: 13px; color: var(--doux); }
.pilules { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pilule { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; background: var(--releve); }
h2.or { font-size: 16px; letter-spacing: .05em; color: var(--or); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 12px; border-radius: 14px; background: var(--carte); border: 1px solid var(--bord); display: flex; flex-direction: column; gap: 8px; }
.stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
.stat .h { display: flex; justify-content: space-between; align-items: baseline; }
.stat .h span { font-size: 13px; font-weight: 600; }
.stat .h b { font-family: var(--f-titre); font-size: 20px; }
.stat .b { height: 6px; border-radius: 4px; background: var(--bord); overflow: hidden; }
.stat .b i { display: block; height: 100%; border-radius: 4px; }
.stat small { font-size: 11px; color: var(--doux); }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.badge { padding: 12px 6px; border-radius: 14px; background: var(--carte); border: 1px solid #4A3F24; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.badge b { font-size: 11px; font-weight: 600; }
.badge small { font-size: 10px; color: var(--doux); }
.badge.verrou { background: #171822; border: 1px dashed var(--bord-fort); }
.badge.verrou b { color: var(--doux); }
.badge.verrou small { color: var(--pale); }
.carte { padding: 14px; border-radius: 16px; background: var(--carte); border: 1px solid var(--bord); display: flex; flex-direction: column; gap: 10px; }
.carte .h { display: flex; justify-content: space-between; font-size: 13px; }
.carte .h span { color: var(--doux); }
.semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 64px; }
.semaine i { display: block; border-radius: 4px; background: var(--or); min-height: 3px; }
.semaine i.futur { background: var(--releve); }
.jours7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 10px; color: var(--doux); text-align: center; }
.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center; }
.chiffres b { display: block; font-family: var(--f-titre); font-size: 20px; color: var(--or); }
.chiffres span { font-size: 11px; color: var(--doux); }

/* ---------- journal ---------- */
.mois { display: flex; align-items: center; justify-content: space-between; padding-top: calc(var(--sat) + 22px); }
.mois h1 { font-size: 22px; text-transform: capitalize; }
.rond { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--bord-fort); background: var(--releve); display: flex; align-items: center; justify-content: center; padding: 0; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .jsem { font-size: 11px; color: var(--pale); text-align: center; padding-bottom: 4px; }
.jour { aspect-ratio: 1; max-width: 100%; border: 0; background: none; padding: 0; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.jour svg { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }
.jour span { position: relative; font-size: 13px; font-weight: 600; }
.jour.hors span { color: var(--eteint); }
.jour.auj span { color: var(--or); }
.jour.sel { background: var(--releve); }
.jour.parfait span { color: var(--sur-or); }
.jour:disabled { cursor: default; }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puce { border: 1px solid var(--bord-fort); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--doux); min-height: 36px; }
.puce.on { background: var(--or); border-color: var(--or); color: var(--sur-or); font-weight: 700; }
textarea { width: 100%; min-height: 96px; resize: vertical; border-radius: 12px; border: 1px solid var(--bord-fort); background: var(--bg); padding: 10px 12px; font-size: 16px; line-height: 1.45; }
.ligne-jour { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--bord); font-size: 14px; }
.ligne-jour:first-child { border-top: 0; }
.ligne-jour .n { flex: 1; min-width: 0; }
.ligne-jour .x { color: var(--doux); font-size: 12px; }

/* ---------- réglages ---------- */
.page-titre { padding-top: calc(var(--sat) + 22px); font-size: 24px; }
.champ { display: flex; flex-direction: column; gap: 6px; }
.champ label, .champ .lab { font-size: 12px; font-weight: 600; color: var(--doux); letter-spacing: .02em; }
input[type=text], input[type=number], select { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--bord-fort); background: var(--bg); padding: 8px 12px; font-size: 16px; }
.reglage { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--bord); }
.reglage:first-of-type { border-top: 0; }
.reglage .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.reglage .t span { font-size: 12px; color: var(--doux); }
.reglage select { width: auto; }
.interrupteur { width: 52px; height: 32px; border-radius: 16px; border: 0; background: var(--eteint); position: relative; padding: 0; flex: none; transition: background .2s; }
.interrupteur::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transition: transform .2s; }
.interrupteur[aria-checked=true] { background: var(--or); }
.interrupteur[aria-checked=true]::after { transform: translateX(20px); }
.q-ligne { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--bord); }
.q-ligne:first-child { border-top: 0; }
.q-ligne .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.q-ligne .t b { font-size: 14px; font-weight: 600; }
.q-ligne .t span { font-size: 12px; color: var(--doux); }
.q-ligne.inactive { opacity: .55; }
.icone-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--releve); display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.icone-btn:disabled { opacity: .35; }
.rangee { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--doux); line-height: 1.5; }
.note ol { margin: 6px 0 0; padding-left: 20px; }
code.bloc-code { display: block; max-height: 120px; overflow: auto; font-size: 11px; background: var(--bg); border: 1px solid var(--bord); border-radius: 10px; padding: 8px; word-break: break-all; }

/* ---------- feuille de saisie ---------- */
.voile { position: fixed; inset: 0; background: rgba(5, 6, 12, .72); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fondu .2s ease; }
.feuille { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--carte); border-radius: 22px 22px 0 0; border-top: 1px solid var(--bord-fort); padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: monte .25s cubic-bezier(.2,.8,.2,1); }
.feuille h2 { font-size: 19px; }
.grille-icones { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.grille-icones button { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--bord-fort); background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 0; }
.grille-icones button.on { border-color: var(--or); background: var(--releve); }
.deux { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@keyframes fondu { from { opacity: 0; } }
@keyframes monte { from { transform: translateY(40px); opacity: 0; } }

/* ---------- navigation ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #161722; border-top: 1px solid #262838; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .interne { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-top: 8px; padding-bottom: 8px; }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--doux); font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px; }
.nav button[aria-current=page] { color: var(--or); }

/* ---------- célébrations ---------- */
.flotte { position: fixed; z-index: 60; pointer-events: none; font-family: var(--f-titre); font-weight: 700; font-size: 18px; color: var(--or); text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; animation: flotte 1.1s ease-out forwards; }
@keyframes flotte { from { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); } to { transform: translate(-50%, -60px) scale(1); opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 70; background: var(--releve); border: 1px solid var(--or); border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; width: min(420px, calc(100% - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toast 3.6s ease forwards; }
.toast b { display: block; font-size: 13px; color: var(--or); }
.toast span { font-size: 12px; color: var(--doux); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -16px); } 8%, 88% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -16px); } }
.celebration { position: fixed; inset: 0; z-index: 80; background: radial-gradient(circle at 50% 45%, rgba(43,37,69,.96) 0%, rgba(10,10,16,.97) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; animation: fondu .3s ease; overflow: hidden; }
.celebration .grand { font-family: var(--f-titre); font-size: 52px; color: var(--or); line-height: 1; animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
.celebration .moyen { font-family: var(--f-titre); font-size: 22px; }
.celebration p { margin: 0; color: var(--doux); max-width: 300px; }
.celebration .rayons { position: absolute; width: 520px; height: 520px; left: 50%; top: 45%; margin: -260px 0 0 -260px; background: repeating-conic-gradient(rgba(227,179,76,.10) 0 10deg, transparent 10deg 20deg); border-radius: 50%; animation: tourne 18s linear infinite; pointer-events: none; }
.celebration > *:not(.rayons):not(.etincelle) { position: relative; }
.etincelle { position: absolute; width: 8px; height: 8px; border-radius: 2px; top: 45%; left: 50%; animation: eclat 1.4s cubic-bezier(.1,.8,.3,1) forwards; pointer-events: none; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@keyframes tourne { to { transform: rotate(360deg); } }
@keyframes eclat { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
.coffre-anim { animation: secoue .6s ease 2; }
@keyframes secoue { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

/* ---------- version 2 : protection du niveau ---------- */
.garde { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 10px; border-radius: 14px; background: var(--releve); color: var(--rouge); font-size: 12px; font-weight: 700; border: 1px solid #5A3036; flex: none; }
.garde.ok { color: var(--vitalite); border-color: #2C4F4A; }
.enjeu { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #2A1C22; border: 1px solid #5A3036; font-size: 13px; color: #F3C9C4; }
.enjeu b { color: var(--rouge); }
.enjeu.ok { background: #172A2A; border-color: #2C4F4A; color: #BFE9E0; }
.enjeu svg { flex: none; }
.regle { flex-direction: row; align-items: flex-start; gap: 12px; }
.regle svg { flex: none; margin-top: 2px; }
.regle p { margin: 0; font-size: 13px; color: var(--doux); line-height: 1.5; }
.semaine i.rate { background: var(--rouge); opacity: .7; }
.jour.penal::after { content: ""; position: absolute; right: 12%; top: 10%; width: 7px; height: 7px; border-radius: 50%; background: var(--rouge); }
.legende { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: -6px 0 0; font-size: 12px; }

  { id: "f16", m: "francais", t: "Éphémère", x: "Est éphémère ce qui ne dure qu'un temps très court. Le mot vient du grec « hêmera », le jour : l'éphémère est un insecte qui ne vit qu'un jour à l'âge adulte.", q: "Donne un synonyme d'« éphémère ».", r: ["passager", "bref", "fugace", "court", "temporaire", "provisoire", "momentané", "fugitif", "transitoire"] },
  { id: "f17", m: "francais", t: "Altruiste", x: "Une personne altruiste se soucie des autres et agit pour leur bien, sans intérêt personnel. Son contraire est l'égoïste, qui ne pense qu'à lui.", q: "Quel est le contraire d'« altruiste » ?", r: ["égoïste", "egocentrique", "égocentrique", "individualiste"] },

  { id: "f20", m: "francais", t: "L'œil", x: "Le pluriel d'œil est yeux. On dit pourtant « des œils-de-bœuf » pour les fenêtres rondes, et « des œils-de-chat » pour certaines pierres.", q: "Quel est le pluriel de « œil » ?", r: ["yeux", "des yeux"] },

  { id: "f22", m: "francais", t: "Un pléonasme", x: "Le pléonasme répète une idée inutilement : « monter en haut », « descendre en bas », « prévoir à l'avance ». Il est en général à éviter.", q: "Comment s'appelle une répétition inutile comme « monter en haut » ?", r: ["pléonasme", "un pléonasme"] },

  { id: "s4", m: "sciences", t: "Le zéro absolu", x: "Le zéro absolu, la température la plus basse possible, vaut 0 kelvin, soit −273,15 °C. À cette température, l'agitation des particules est minimale.", q: "À combien de degrés Celsius correspond le zéro absolu (arrondi à l'unité) ?", r: ["-273"], tol: 0.2 },
  { id: "s5", m: "sciences", t: "Le son et le vide", x: "Le son est une vibration qui se propage dans la matière (air, eau, solides). Dans le vide de l'espace, il n'y a rien pour la transmettre : aucun son ne peut s'y propager.", q: "Le son se propage-t-il dans le vide ? (oui ou non)", r: ["non"] },

  { id: "s8", m: "sciences", t: "L'eau", x: "La molécule d'eau, H₂O, est formée de deux atomes d'hydrogène et d'un atome d'oxygène. Au niveau de la mer, l'eau pure bout à 100 °C.", q: "Combien d'atomes d'hydrogène contient une molécule d'eau ?", r: ["2", "deux"] },
  { id: "s9", m: "sciences", t: "Le symbole du sodium", x: "Dans le tableau périodique, le sodium a pour symbole Na, de son nom latin « natrium ». Le sel de cuisine est du chlorure de sodium, NaCl.", q: "Quel est le symbole chimique du sodium ?", r: ["Na"] },
  { id: "s10", m: "sciences", t: "Le symbole de l'or", x: "L'or a pour symbole Au, du latin « aurum ». C'est un métal très peu réactif : il ne rouille pas, ce qui explique qu'on retrouve des bijoux intacts après des millénaires.", q: "Quel est le symbole chimique de l'or ?", r: ["Au"] },
  { id: "s11", m: "sciences", t: "Le pH", x: "Le pH mesure l'acidité d'une solution, sur une échelle de 0 à 14. Un pH de 7 est neutre (eau pure), en dessous c'est acide (citron, environ 2), au-dessus c'est basique (savon).", q: "Quelle est la valeur du pH d'une solution neutre ?", r: ["7"] },
  { id: "s12", m: "sciences", t: "L'air que l'on respire", x: "L'air est composé d'environ 78 % de diazote, 21 % de dioxygène et 1 % d'autres gaz, dont l'argon et le dioxyde de carbone.", q: "Quel gaz est le plus abondant dans l'air ?", r: ["azote", "diazote", "N2"] },
  { id: "s13", m: "sciences", t: "Le numéro atomique", x: "Le numéro atomique d'un élément est le nombre de protons dans son noyau. L'hydrogène a 1 proton, le carbone 6, l'oxygène 8.", q: "Quel est le numéro atomique du carbone ?", r: ["6"] },
  { id: "s14", m: "sciences", t: "Le tableau périodique", x: "En 1869, le chimiste russe Dmitri Mendeleïev classe les éléments chimiques par masse et par propriétés, et laisse des cases vides pour des éléments encore inconnus, qui seront découverts ensuite.", q: "Quel chimiste russe a créé le tableau périodique des éléments ?", r: ["Mendeleïev", "Mendeleiev", "Dmitri Mendeleïev"] },
  { id: "s15", m: "sciences", t: "Les chromosomes", x: "Chaque cellule humaine (sauf les ovules et les spermatozoïdes) contient 46 chromosomes, répartis en 23 paires. Ils portent notre ADN.", q: "Combien de chromosomes contient une cellule humaine ordinaire ?", r: ["46"] },
  { id: "s16", m: "sciences", t: "La photosynthèse", x: "Grâce à la lumière, les plantes fabriquent du sucre à partir de dioxyde de carbone et d'eau, et rejettent du dioxygène. C'est la photosynthèse, qui a lieu dans les chloroplastes.", q: "Quel gaz les plantes rejettent-elles pendant la photosynthèse ?", r: ["oxygène", "dioxygène", "O2"] },
  { id: "s17", m: "sciences", t: "La mitochondrie", x: "La mitochondrie est la « centrale énergétique » de la cellule : elle utilise l'oxygène pour transformer le sucre en énergie utilisable.", q: "Quel organite est la centrale énergétique de la cellule ?", r: ["mitochondrie", "la mitochondrie", "mitochondries"] },
  { id: "s18", m: "sciences", t: "L'ADN", x: "L'ADN a la forme d'une double hélice, découverte en 1953 par James Watson et Francis Crick, grâce aux images de Rosalind Franklin.", q: "Quelle forme a la molécule d'ADN ? (deux mots)", r: ["double hélice", "une double hélice"] },
  { id: "s19", m: "sciences", t: "La fin des dinosaures", x: "Les dinosaures non aviens ont disparu il y a environ 66 millions d'années, à la fin du Crétacé, probablement après la chute d'un astéroïde au Mexique (cratère de Chicxulub). Les oiseaux sont leurs descendants.", q: "Il y a combien de millions d'années les dinosaures non aviens ont-ils disparu ?", r: ["66"], tol: 1 },
  { id: "s20", m: "sciences", t: "Le Tyrannosaure", x: "Tyrannosaurus rex a vécu à la toute fin du Crétacé, il y a 68 à 66 millions d'années, en Amérique du Nord. Il est donc plus proche de nous dans le temps que du Stégosaure, qui vivait au Jurassique.", q: "À quelle période géologique vivait le Tyrannosaure ?", r: ["Crétacé", "le Crétacé"] },
  { id: "s21", m: "sciences", t: "Archaeopteryx", x: "Archaeopteryx, découvert en Allemagne en 1861, vivait au Jurassique. Avec ses plumes, ses dents et sa longue queue osseuse, il montre le lien entre dinosaures et oiseaux.", q: "Quel animal fossile montre le lien entre dinosaures et oiseaux (découvert en 1861) ?", r: ["Archaeopteryx", "Archéoptéryx", "archeopteryx"] },
  { id: "s22", m: "sciences", t: "Lucy", x: "Lucy est un squelette d'australopithèque découvert en 1974 en Éthiopie. Elle a vécu il y a environ 3,2 millions d'années et marchait déjà sur deux jambes.", q: "Dans quel pays Lucy a-t-elle été découverte ?", r: ["Éthiopie", "Ethiopie"] },
  { id: "s23", m: "sciences", t: "Les plus anciens Homo sapiens", x: "Les plus anciens fossiles connus d'Homo sapiens, découverts à Jebel Irhoud au Maroc, ont environ 300 000 ans.", q: "Dans quel pays ont été trouvés les plus anciens fossiles connus d'Homo sapiens ?", r: ["Maroc"] },
  { id: "s24", m: "sciences", t: "La Pangée", x: "Il y a environ 300 millions d'années, les continents étaient réunis en un seul supercontinent, la Pangée, entouré d'un océan unique. Il s'est fragmenté à partir de 200 millions d'années.", q: "Comment s'appelle le supercontinent qui réunissait toutes les terres ?", r: ["Pangée", "la Pangée", "Pangea"] },
  { id: "s25", m: "sciences", t: "Les trilobites", x: "Les trilobites sont des arthropodes marins apparus il y a plus de 520 millions d'années. Ils ont disparu à la fin du Paléozoïque (ère primaire), il y a 252 millions d'années.", q: "Les trilobites vivaient-ils dans la mer ou sur terre ?", r: ["mer", "dans la mer", "océan", "la mer"] },
  { id: "s26", m: "sciences", t: "Le carbone 14", x: "Le carbone 14 permet de dater des restes organiques (os, bois, charbon) jusqu'à environ 50 000 ans. Au-delà, il en reste trop peu : on utilise d'autres méthodes pour les fossiles de dinosaures.", q: "Jusqu'à combien d'années environ peut-on dater avec le carbone 14 ?", r: ["50000"], tol: 5000 },
  { id: "s27", m: "sciences", t: "La plus grosse planète", x: "Jupiter est la plus grosse planète du Système solaire : on pourrait y loger plus de 1 300 Terres. C'est une géante gazeuse, surtout faite d'hydrogène et d'hélium.", q: "Quelle est la plus grosse planète du Système solaire ?", r: ["Jupiter"] },
  { id: "s28", m: "sciences", t: "L'âge de la Terre", x: "La Terre s'est formée il y a environ 4,5 milliards d'années, en même temps que le reste du Système solaire.", q: "Quel âge a la Terre, en milliards d'années (environ) ?", r: ["4.5", "4,5"], tol: 0.1 },
  { id: "s29", m: "sciences", t: "La planète la plus proche du Soleil", x: "Mercure est la planète la plus proche du Soleil et la plus petite du Système solaire. Elle fait le tour du Soleil en 88 jours.", q: "Quelle est la planète la plus proche du Soleil ?", r: ["Mercure"] },
  { id: "s30", m: "sciences", t: "La distance de la Lune", x: "La Lune est en moyenne à 384 400 km de la Terre. La lumière met un peu plus d'une seconde pour faire ce trajet.", q: "À environ combien de milliers de km la Lune se trouve-t-elle ? (ex. : 384)", r: ["384"], tol: 6 },
  { id: "s31", m: "sciences", t: "Le noyau de la Terre", x: "Le noyau terrestre est surtout composé de fer, avec un peu de nickel. Le noyau externe est liquide : ses mouvements créent le champ magnétique terrestre.", q: "Quel métal compose principalement le noyau de la Terre ?", r: ["fer", "le fer"] },
  { id: "s32", m: "sciences", t: "Marie Curie", x: "Marie Curie est la première personne à avoir reçu deux prix Nobel : en physique (1903) pour la radioactivité, et en chimie (1911) pour la découverte du polonium et du radium.", q: "Combien de prix Nobel Marie Curie a-t-elle reçus ?", r: ["2", "deux"] },

  { id: "l2", m: "logique", t: "La batte et la balle", x: "Méfie-toi de la première réponse qui vient à l'esprit : pose l'équation. Si la balle coûte x, la batte coûte x + 1 €.", q: "Une batte et une balle coûtent 1,10 € en tout. La batte coûte 1 € de plus que la balle. Combien coûte la balle, en centimes ?", r: ["5"] },

// Calcul mental : questions générées sans fin, à partir d'une graine
function genererCalcul(graine) {
  let s = graine >>> 0;
  const r = (a, b) => { s = (Math.imul(s ^ (s >>> 15), 2246822507) + 0x9E3779B9) >>> 0; return a + (s % (b - a + 1)); };
  const types = [
    () => { const a = r(13, 49), b = r(3, 9); return { t: "Multiplier de tête", x: "Astuce : décompose le grand nombre. " + a + " × " + b + " = (" + (a - a % 10) + " × " + b + ") + (" + (a % 10) + " × " + b + ").", q: a + " × " + b + " = ?", r: [String(a * b)] }; },
    () => { const p = [10, 15, 20, 25, 30, 40, 50, 75][r(0, 7)], n = r(2, 24) * 20; return { t: "Pourcentage", x: "Astuce : 10 % = diviser par 10 ; 5 % = la moitié de 10 % ; 25 % = le quart.", q: p + " % de " + n + " = ?", r: [String(p * n / 100)] }; },
    () => { const b = r(6, 15), q = r(12, 35); return { t: "Division", x: "Astuce : cherche le multiple de " + b + " le plus proche, puis complète.", q: (b * q) + " ÷ " + b + " = ?", r: [String(q)] }; },
    () => { const a = r(11, 25); return { t: "Carré", x: "Astuce : (a + b)² = a² + 2ab + b². Par exemple 13² = 100 + 60 + 9 = 169.", q: a + "² = ?", r: [String(a * a)] }; },
    () => { const a = r(120, 899), b = r(110, 799); return { t: "Addition", x: "Astuce : ajoute d'abord les centaines, puis les dizaines, puis les unités.", q: a + " + " + b + " = ?", r: [String(a + b)] }; },
    () => { const b = r(120, 499), a = b + r(110, 499); return { t: "Soustraction", x: "Astuce : complète jusqu'à la centaine supérieure, puis ajoute le reste.", q: a + " − " + b + " = ?", r: [String(a - b)] }; },
    () => { const d = r(2, 9), u = r(3, 9), k = r(2, 6); return { t: "Fraction d'un nombre", x: "Pour prendre les " + k + "/" + d + " d'un nombre : divise par " + d + ", puis multiplie par " + k + ".", q: k + "/" + d + " de " + (d * u * 4) + " = ?", r: [String(k * u * 4)] }; },
    () => { const v = [60, 80, 90, 100, 120][r(0, 4)], h = [1.5, 2, 2.5, 3][r(0, 3)]; return { t: "Vitesse et distance", x: "Distance = vitesse × durée. 1 h 30 = 1,5 h ; 2 h 30 = 2,5 h.", q: "À " + v + " km/h pendant " + String(h).replace(".", ",") + " h, combien de km parcourt-on ?", r: [String(v * h)] }; },
    () => { const a = r(1, 9), d = r(3, 9); const suite = [a, a + d, a + 2 * d, a + 3 * d]; return { t: "Suite logique", x: "Cherche ce qui change d'un nombre au suivant : on ajoute toujours la même valeur.", q: "Quel nombre vient ensuite : " + suite.join(", ") + ", … ?", r: [String(a + 4 * d)] }; },
    () => { const a = r(1, 4), k = r(2, 3); const suite = [a, a * k, a * k * k, a * k * k * k]; return { t: "Suite logique", x: "Ici, on multiplie toujours par le même nombre.", q: "Quel nombre vient ensuite : " + suite.join(", ") + ", … ?", r: [String(a * k ** 4)] }; },
    () => { const h = r(2, 5), m = [15, 30, 45][r(0, 2)]; return { t: "Conversion de durées", x: "1 heure = 60 minutes. Multiplie les heures par 60, puis ajoute les minutes.", q: h + " h " + m + " = combien de minutes ?", r: [String(h * 60 + m)] }; },
  ];
  const l = types[r(0, types.length - 1)]();
  l.m = "calcul";
  l.id = "calc:" + graine;
  return l;
}

  celebrer({ grand: "+" + BONUS_COFFRE + " XP", moyen: "Coffre du jour ouvert", texte: "Toutes les quêtes du jour sont accomplies. Bravo !", icone: "coffre" });
  apres(true);
}
function apres(differer) {
  sauver();
  const st = stats();
  for (const h of HAUTS_FAITS) {
    if (!S.succes[h.id] && h.v(st) >= h.max) { S.succes[h.id] = aujourdhui(); toast("Haut fait débloqué : " + h.nom, h.desc); }
  }
  sauver();

    const c = () => { son("niveau"); celebrer({ grand: "Niveau " + st.niveau, moyen: titreDe(st.niveau), texte: "Tu montes de niveau. Continue sur cette lancée !", icone: "bouclier" }); };
    if (differer) setTimeout(c, 2600); else c();
  }

}

// ------------------------------------------------------------------ effets
let audio = null;
function son(type) {
  if (!S.params.son) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { niveau: [523, 659, 784, 1047], coffre: [392, 523, 659, 784], fin: [880, 660, 880, 1175], erreur: [330, 247], perte: [392, 330, 262] }[type] || [660, 990];
    const t0 = audio.currentTime;
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type === "erreur" || type === "perte" ? "sine" : "triangle"; o.frequency.value = f;
      const t = t0 + i * 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + 0.34);
    });
  } catch (e) { /* son indisponible */ }
}
function flotte(ev, texte) {
  const el = document.createElement("div");
  el.className = "flotte";
  el.textContent = texte;
  const r = ev && ev.target && ev.target.closest ? ev.target.closest("button,.quete") : null;
  const b = r ? r.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
  el.style.left = (b.left + b.width / 2) + "px";
  el.style.top = (b.top - 6) + "px";

  setTimeout(() => el.remove(), 1200);
}
let fileToasts = Promise.resolve();
function toast(titre, texte) { fileToasts = fileToasts.then(() => new Promise(fin => { afficherToast(titre, texte); setTimeout(fin, 3300); })); }
function afficherToast(titre, texte) {
  const el = document.createElement("div");

  el.innerHTML = `${ic("etoile", "var(--or)", 26)}<div><b>${esc(titre)}</b><span>${esc(texte)}</span></div>`;

}
function celebrer({ grand, moyen, texte, icone, defaite }) {
  const el = document.createElement("div");
  el.className = "celebration" + (defaite ? " defaite" : "");
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", grand);

  if (!defaite) {
    const couleurs = ["var(--or)", "var(--force)", "var(--savoir)", "var(--esprit)", "var(--vitalite)", "var(--discipline)"];
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2, d = 120 + (i * 37) % 120;
      eclats += `<i class="etincelle" style="background:${couleurs[i % couleurs.length]};--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d)}px;animation-delay:${(i % 6) * 0.03}s"></i>`;
    }
  }
  el.innerHTML = `${defaite ? "" : '<div class="rayons"></div>'}${eclats}<div class="${defaite ? "chute" : "coffre-anim"}">${ic(icone, defaite ? "var(--rouge)" : "var(--or)", 64, 1.6)}</div>
    <div class="grand">${esc(grand)}</div><div class="moyen">${esc(moyen)}</div><p>${esc(texte)}</p>

}
function annoncerPenalites() {
  const st = stats();
  if (st.penalites.length > S.penalitesVues) {
    const p = st.penalites[st.penalites.length - 1], n = st.penalites.length - S.penalitesVues;

let MINUTEUR = null, verrou = null;
function lancerMinuteur(sec, label) {
  MINUTEUR = { fin: Date.now() + sec * 1000, label };
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(v => { verrou = v; }).catch(() => {}); } catch (e) { /* facultatif */ }
  majMinuteur();
}
function arreterMinuteur() { MINUTEUR = null; try { if (verrou) verrou.release(); } catch (e) { /* rien */ } verrou = null; majMinuteur(); }
function majMinuteur() {
  const el = document.getElementById("minuteur");
  if (!MINUTEUR) { if (el) el.hidden = true; return; }
  const reste = Math.max(0, Math.ceil((MINUTEUR.fin - Date.now()) / 1000));
  if (el) {
    el.hidden = false;
    el.querySelector("b").textContent = Math.floor(reste / 60) + ":" + String(reste % 60).padStart(2, "0");
    el.querySelector("span").textContent = MINUTEUR.label;
  }
  if (reste === 0) { const l = MINUTEUR.label; arreterMinuteur(); son("fin"); toast("Temps écoulé", l); }
}
setInterval(majMinuteur, 250);

function anneau(ratio, parfait, rate) {
  const r = 15, c = 2 * Math.PI * r;

    ${ratio > 0 ? `<circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--or)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(ratio * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/>` : ""}</svg>`;
}

  const k = JOUR_SEL, j = jour(k), b = bilanJour(k), p = st.penalites.find(x => x.k === k);
  html += `<div class="carte"><div class="h"><b>${majuscule(dateLongue(k))}</b><span class="num">${b.faites} / ${b.total} · +${nf(b.xp)} XP</span></div>`;
  if (p) html += `<p class="note alerte">${ic("bouclierBrise", "var(--rouge)", 16)} Série rompue ce jour-là : niveau ${p.de} → ${p.a}.</p>`;
  if (k !== auj) html += `<p class="note" style="margin:0">Tu peux corriger une quête oubliée. Les leçons, elles, ne se valident qu'en répondant juste le jour même.</p>`;
  html += `<div>`;
  const ids = j.liste.length ? j.liste : prevues(k).map(q => q.id);
  for (const id of ids) {
    const q = queteId(id);
    if (!q) continue;
    const fait = !!j.gains[id];
    const val = q.type === "compteur" ? `${Number(j.q[id]) || 0} / ${q.objectif} ${esc(q.unite || "")}` : "";
    const verrouille = q.contenu === "lecon";
    html += `<div class="ligne-jour">${ic(q.icone, (CATS[q.cat] || CATS.discipline).c, 18)}<span class="n">${esc(q.nom)} <span class="x">${val}</span></span>
      ${verrouille ? `<span class="coche petite ${fait ? "on" : ""}" aria-label="${fait ? "Réussie" : "Non réussie"}">${fait ? ic("coche", "var(--sur-or)", 14, 3) : ""}</span>`
        : `<button class="coche petite" data-a="basculer-jour" data-id="${id}" aria-pressed="${fait}" aria-label="${fait ? "Annuler" : "Valider"} ${esc(q.nom)}">${fait ? ic("coche", "var(--sur-or)", 14, 3) : ""}</button>`}</div>`;
  }
  if (!ids.length) html += `<p class="note">Aucune quête prévue ce jour-là.</p>`;
  html += `</div></div>`;
  html += `<div class="carte"><div class="champ"><label for="note-jour">Ce que je retiens de cette journée</label>
    <textarea id="note-jour" data-k="${k}" placeholder="Une victoire, une difficulté, une idée pour demain…">${esc(j.note)}</textarea></div>
    <div class="champ"><span class="lab">Humeur</span><div class="puces">${["Rayonnante", "Bonne", "Neutre", "Fatiguée", "Difficile"].map(h =>
      `<button class="puce ${j.humeur === h ? "on" : ""}" data-a="humeur" data-h="${h}" aria-pressed="${j.humeur === h}">${h}</button>`).join("")}</div></div>
    <div class="champ"><span class="lab">Énergie</span><div class="puces">${["Haute", "Moyenne", "Basse"].map(h =>
      `<button class="puce ${j.energie === h ? "on" : ""}" data-a="energie" data-h="${h}" aria-pressed="${j.energie === h}">${h}</button>`).join("")}</div></div></div>`;
  return html + `</div>`;
}

// ------------------------------------------------------------------ propositions du jour
function ouvrirFeuille(qid) { FEUILLE = { qid }; rendreFeuille(); }
function fermerFeuille() { FEUILLE = null; arreterMinuteur(); const f = document.getElementById("feuille"); if (f) f.remove(); rendre(); }
function rendreFeuille() {
  const q = queteId(FEUILLE.qid);
  if (!q) { FEUILLE = null; return; }
  const k = aujourdhui(), j = jour(k), fait = !!j.gains[q.id];
  const corps = { priere_matin: feuillePriere, priere_soir: feuillePriere, chapelet: feuilleChapelet, exercices: feuilleExercices,
    course: feuilleCourse, lecture: feuilleLecture, lecon: feuilleLecon }[q.contenu] || feuillePriere;
  let el = document.getElementById("feuille");
  if (!el) { // la coque n'est créée qu'une fois : pas d'animation à chaque mise à jour
    el = document.createElement("div"); el.id = "feuille";
    el.innerHTML = `<div class="voile" data-a="fermer-feuille-fond"><div class="feuille gouttiere grande" role="dialog" aria-modal="true" aria-labelledby="titre-feuille"></div></div>`;
    document.body.appendChild(el);
  }
  const f = el.querySelector(".feuille"), garderDefilement = f.scrollTop;
  const cat = CATS[q.cat] || CATS.discipline;
  f.innerHTML = `<div class="tete-feuille"><div class="tuile" style="background:${cat.f}">${ic(q.icone, cat.c, 20)}</div>
      <div class="t"><h2 id="titre-feuille">${esc(q.nom)}</h2><span>${esc(majuscule(dateLongue(k)))} · +${q.xp} XP</span></div>
      <button class="icone-btn" data-a="fermer-feuille" aria-label="Fermer">${ic("croixFermer", "currentColor", 18)}</button></div>
    <div id="minuteur" class="minuteur" hidden><b class="num">0:00</b><span></span><button class="btn" data-a="stop-minuteur">Arrêter</button></div>
    ${corps(q, j, k, fait)}`;
  f.scrollTop = garderDefilement;
  majMinuteur();
}
function boutonValider(q, fait, texte) {
  return fait ? `<div class="bandeau-ok">${ic("coche", "var(--vitalite)", 18, 3)} Quête accomplie. Bravo !</div>`
    : `<button class="btn-or large" data-a="valider-feuille" data-id="${q.id}">${texte}</button>`;
}
function bloc(titre, texte, cls = "") { return `<section class="bloc ${cls}"><h3>${esc(titre)}</h3><p>${esc(texte).replace(/\n/g, "<br>")}</p></section>`; }

function feuillePriere(q, j, k, fait) {
  const n = numJour(k);
  if (q.contenu === "priere_soir") {
    const p = PRIERES_SOIR[n % PRIERES_SOIR.length];
    return `<p class="note">Prends un moment au calme, avant de dormir.</p>` + bloc("Signe de croix", P.signe) +
      `<section class="bloc"><h3>Examen de conscience</h3><ol class="etapes">${EXAMEN.map(e => `<li>${esc(e)}</li>`).join("")}</ol></section>` +
      bloc(p.titre, p.texte, "fort") + bloc("Je vous salue Marie", P.ave) + bloc("Pour finir", P.remets) +
      boutonValider(q, fait, "J'ai prié · valider la quête");
  }
  const p = PRIERES_MATIN[n % PRIERES_MATIN.length], parole = PAROLES[n % PAROLES.length], intention = INTENTIONS[(n * 5) % INTENTIONS.length];
  return `<p class="note">Commence la journée avec Dieu : 5 à 10 minutes suffisent.</p>` + bloc("Signe de croix", P.signe) +
    bloc("Offrande de la journée", P.offrande) + bloc(p.titre, p.texte, "fort") +
    `<section class="bloc parole"><h3>Parole à méditer</h3><p>« ${esc(parole[0])} »</p><small>${esc(parole[1])}</small></section>` +
    bloc("Intention du jour", intention) + bloc("Notre Père", P.notrePere) + bloc("Gloire au Père", P.gloire) +
    boutonValider(q, fait, "J'ai prié · valider la quête");
}

function feuilleChapelet(q, j, k, fait) {
  const type = MYSTERES_DU_JOUR[jourSemaine(k)], mysteres = MYSTERES[type];
  const total = q.objectif || 1;
  const c = j.chapelet || (j.chapelet = { d: 0, ave: 0, debut: false });
  const faites = Number(j.q[q.id]) || 0;
  const premier = total >= 5 ? 0 : numJour(k) % 5; // une dizaine : le mystère change chaque jour
  let html = `<p class="note">Mystères ${type} (${JOURS_NOMS[jourSemaine(k)]}). ${total === 1 ? "Une dizaine aujourd'hui." : pluriel(total, "dizaine") + " aujourd'hui."}</p>
    <ol class="mysteres">${mysteres.map((m, i) => {
      const idx = total >= 5 ? i : (i === premier ? 0 : -1);
      const etat = idx < 0 ? "" : idx < faites ? "fini" : idx === faites ? "actuel" : "";
      return `<li class="${etat}">${esc(majuscule(m))}</li>`;
    }).join("")}</ol>`;
  if (!c.debut && faites === 0) {
    html += `<section class="bloc"><h3>Pour commencer</h3><p>Signe de croix, puis le Je crois en Dieu, un Notre Père, trois Je vous salue Marie et un Gloire au Père.</p>
      <details><summary>Afficher le Je crois en Dieu</summary><p>${esc(P.credo)}</p></details></section>
      <button class="btn-or large" data-a="chapelet-debut">C'est fait, j'entre dans la première dizaine</button>`;
    return html;
  }
  if (faites >= total) return html + boutonValider(q, true, "");
  const mystere = total >= 5 ? mysteres[faites] : mysteres[premier];
  html += `<section class="bloc fort"><h3>Dizaine ${faites + 1}${total > 1 ? " sur " + total : ""} : ${esc(mystere)}</h3>
    <p>Annonce le mystère, prie un Notre Père, puis dix Je vous salue Marie en méditant la scène.</p></section>
    <button class="grain" data-a="ave" aria-label="Je vous salue Marie, ${c.ave} sur 10">
      <span class="num">${c.ave}<small>/10</small></span><em>Je vous salue Marie</em></button>
    <div class="grains" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i class="${i < c.ave ? "on" : ""}"></i>`).join("")}</div>
    <details><summary>Le texte du Je vous salue Marie</summary><p>${esc(P.ave)}</p></details>`;
  if (c.ave >= 10) html += `<section class="bloc"><h3>Gloire au Père</h3><p>${esc(P.gloire)}</p><p class="note">Puis : « Ô mon Jésus, pardonnez-nous nos péchés, préservez-nous du feu de l'enfer, conduisez au ciel toutes les âmes, surtout celles qui ont le plus besoin de votre miséricorde. »</p></section>
    <button class="btn-or large" data-a="dizaine-finie" data-id="${q.id}">Dizaine terminée</button>`;
  return html;
}

function seanceDuJour(k) {
  const s = SEANCES[jourSemaine(k)], semaine = Math.floor(numJour(k) / 7);
  const debut = semaine % s.exos.length;
  const ids = Array.from({ length: Math.min(5, s.exos.length) }, (_, i) => s.exos[(debut + i) % s.exos.length]);
  return { titre: s.titre, exos: ids.map(id => Object.assign({ id }, EXOS[id])) };
}
function feuilleExercices(q, j, k, fait) {
  const s = seanceDuJour(k), tours = 3, coches = j.seance || {};
  let html = `<p class="note">Séance « ${esc(s.titre)} » · environ 25 min · ${tours} tours du circuit, 30 s de repos entre les exercices, 90 s entre les tours.</p>
    <section class="bloc"><h3>Échauffement (4 min)</h3><ul class="liste-simple">${ECHAUFFEMENT.map(([n, d]) => `<li><span>${esc(n)}</span><b>${esc(d)}</b></li>`).join("")}</ul></section>
    <section class="bloc fort"><h3>Circuit</h3>`;
  s.exos.forEach((e, i) => {
    html += `<div class="exo"><div class="exo-t"><b>${esc(e.nom)}</b><span class="num">${e.m === "sec" ? e.v + " s" : e.v + " répétitions"}</span></div>
      <p>${esc(e.c)}</p><div class="exo-b">${Array.from({ length: tours }, (_, t) => {
        const cle = i + "_" + t, on = !!coches[cle];
        return `<button class="tour ${on ? "on" : ""}" data-a="tour" data-c="${cle}" aria-pressed="${on}" aria-label="${esc(e.nom)}, tour ${t + 1}">${t + 1}</button>`;
      }).join("")}${e.m === "sec" ? `<button class="btn-mini" data-a="minuteur" data-s="${e.v}" data-l="${esc(e.nom)}">${ic("lecture", "currentColor", 12, 2.4)} ${e.v} s</button>` : ""}</div></div>`;
  });
  html += `<div class="rangee"><button class="btn" data-a="minuteur" data-s="30" data-l="Repos">Repos 30 s</button><button class="btn" data-a="minuteur" data-s="90" data-l="Repos entre deux tours">Repos 90 s</button></div></section>
    <section class="bloc"><h3>Retour au calme</h3><ul class="liste-simple">${RETOUR_CALME.map(([n, d]) => `<li><span>${esc(n)}</span><b>${esc(d)}</b></li>`).join("")}</ul></section>
    <p class="note">Trop facile ? Ajoute 2 répétitions ou 10 secondes. Douleur articulaire : arrête l'exercice.</p>`;
  return html + boutonValider(q, fait, "Séance terminée · valider la quête");
}
function feuilleCourse(q, j, k, fait) {
  const c = COURSES[numJour(k) % COURSES.length];
  return `<p class="note">Séance du jour · ${esc(c.duree)}</p>
    <section class="bloc fort"><h3>${esc(c.titre)}</h3><ol class="etapes">${c.etapes.map(e => `<li>${esc(e)}</li>`).join("")}</ol></section>
    <div class="rangee"><button class="btn" data-a="minuteur" data-s="600" data-l="Échauffement">Minuteur 10 min</button><button class="btn" data-a="minuteur" data-s="1800" data-l="Course">Minuteur 30 min</button></div>
    <p class="note">Bois avant et après. En cas de douleur, passe à la marche rapide.</p>` + boutonValider(q, fait, "Séance terminée · valider la quête");
}
function feuilleLecture(q, j, k, fait) {
  const idee = LECTURES[numJour(k) % LECTURES.length], v = Number(j.q[q.id]) || 0;
  return `<section class="bloc fort"><h3>Idée de lecture</h3><p>${esc(idee)}</p></section>
    <section class="bloc"><h3>Mes pages aujourd'hui</h3><div class="compteur grand-compteur">
      <button data-a="moins" data-id="${q.id}" aria-label="Retirer ${q.pas || 1} pages">${ic("moins", "currentColor", 18, 2.5)}</button>
      <output class="num">${v} / ${q.objectif} ${esc(q.unite || "")}</output>

}
function feuilleLecon(q, j, k, fait) {
  const obj = q.objectif || 1, ok = Number(j.q[q.id]) || 0;
  if (!j.lecon) nouvelleLecon(k);
  const cur = j.lecon, l = leconParId(cur.id);
  let html = `<div class="progres-lecon">${Array.from({ length: obj }, (_, i) => `<i class="${i < ok ? "on" : ""}"></i>`).join("")}<span class="num">${Math.min(ok, obj)} / ${obj} réussies${ok > obj ? " (+" + (ok - obj) + " en bonus)" : ""}</span></div>
    <section class="bloc lecon"><span class="matiere">${ic(l.m === "calcul" ? "calcul" : l.m === "sciences" ? "flacon" : "livre_ouvert", "currentColor", 14)} ${esc(MATIERES[l.m] || "")}</span>
      <h3>${esc(l.t)}</h3><p>${esc(l.x)}</p></section>
    <section class="bloc question"><h3>Question</h3><p class="q">${esc(l.q)}</p>`;
  if (cur.etat === "question") {
    html += `<form data-form="lecon" data-id="${q.id}" autocomplete="off"><label for="reponse" class="lab">Ta réponse</label>
      <div class="ligne-reponse"><input type="text" id="reponse" value="${esc(cur.saisie || "")}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button class="btn-or" type="submit">Vérifier</button></div></form>`;
    if (cur.message) html += `<p class="retour ko" role="alert">${esc(cur.message)}</p>`;
  } else if (cur.etat === "juste") {
    html += `<p class="retour ok" role="status">${ic("coche", "var(--vitalite)", 16, 3)} Bonne réponse : ${esc(cur.saisie)}</p>`;
  } else {
    html += `<p class="retour ko" role="status">La réponse était : <b>${esc(l.r[0])}</b>. Retiens-la, elle reviendra plus tard.</p>`;
  }
  html += `</section>`;
  if (cur.etat !== "question") {
    html += fait && ok >= obj ? `<div class="bandeau-ok">${ic("coche", "var(--vitalite)", 18, 3)} Quête « ${esc(q.nom)} » accomplie !</div>
      <button class="btn large" data-a="lecon-suivante">Encore une leçon (pour le plaisir)</button>`
      : `<button class="btn-or large" data-a="lecon-suivante">Leçon suivante</button>`;
  }
  return html;
}

function resumeJours(js) {
  js = js || TOUS;
  if (js.length === 7) return "Tous les jours";
  const k = [...js].sort().join(",");
  if (k === "0,1,2,3,4") return "En semaine";
  if (k === "5,6") return "Le week-end";
  return [...js].sort().map(i => JOURS_NOMS[i].slice(0, 3)).join(", ");
}
function interrupteur(action, actif, label, id) {

}

      : `<button class="btn danger" data-a="reset">Recommencer à zéro</button>`}
    </div>
    <p class="note" style="text-align:center">Mes Quêtes 2.0</p>
  </div>`;
  return html;
}

// ------------------------------------------------------------------ éditeur de quête
function ouvrirEditeur(id) {
  const q = id ? queteId(id) : { id: "", nom: "", detail: "", cat: "savoir", xp: 30, type: "case", objectif: 10, unite: "min", pas: 5, jours: TOUS, moment: "journee", icone: "etoile", contenu: "", actif: true };
  EDITION = JSON.parse(JSON.stringify(q));
  EDITION.jours = EDITION.jours || TOUS;
  EDITION.contenu = EDITION.contenu || "";
  CONFIRMER = null;
  rendre();
}
function rendreEditeur() {
  const e = EDITION, imposeCompteur = e.contenu === "lecon" || e.contenu === "chapelet";
  let ed = document.getElementById("editeur");
  if (!ed) { ed = document.createElement("div"); ed.id = "editeur"; document.body.appendChild(ed); }
  ed.innerHTML = `<div class="voile" data-a="fermer-editeur-fond"><div class="feuille gouttiere" role="dialog" aria-modal="true" aria-labelledby="titre-ed">
    <h2 id="titre-ed">${e.id ? "Modifier la quête" : "Nouvelle quête"}</h2>
    <div class="champ"><label for="ed-nom">Nom</label><input type="text" id="ed-nom" value="${esc(e.nom)}" maxlength="40" placeholder="Ex. : Lecture" autocomplete="off"></div>
    <div class="champ"><label for="ed-detail">Précision</label><input type="text" id="ed-detail" value="${esc(e.detail)}" maxlength="60" placeholder="Ex. : 20 pages d'un roman" autocomplete="off"></div>
    <div class="champ"><label for="ed-contenu">Proposition du jour</label><select id="ed-contenu">${Object.entries(CONTENUS).map(([v, t]) => `<option value="${v}" ${e.contenu === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="champ"><span class="lab">Caractéristique</span><div class="puces">${Object.entries(CATS).map(([k, c]) =>
      `<button class="puce ${e.cat === k ? "on" : ""}" data-a="ed-cat" data-v="${k}" aria-pressed="${e.cat === k}">${c.nom}</button>`).join("")}</div></div>
    <div class="champ"><span class="lab">Récompense (60 XP et plus : quête rare, 80 et plus : épique)</span><div class="puces">${XP_CHOIX.map(x =>
      `<button class="puce num ${e.xp === x ? "on" : ""}" data-a="ed-xp" data-v="${x}" aria-pressed="${e.xp === x}">+${x}</button>`).join("")}</div></div>
    ${imposeCompteur ? `<div class="champ"><label for="ed-obj">${e.contenu === "lecon" ? "Leçons à réussir par jour" : "Dizaines par jour (5 = chapelet complet)"}</label>
        <input type="number" id="ed-obj" min="1" max="${e.contenu === "lecon" ? 20 : 5}" value="${e.objectif || 1}" inputmode="numeric"></div>`
      : `<div class="champ"><span class="lab">Type</span><div class="puces">
      <button class="puce ${e.type === "case" ? "on" : ""}" data-a="ed-type" data-v="case" aria-pressed="${e.type === "case"}">À cocher</button>
      <button class="puce ${e.type === "compteur" ? "on" : ""}" data-a="ed-type" data-v="compteur" aria-pressed="${e.type === "compteur"}">À compter (pages, minutes, verres…)</button></div></div>
    ${e.type === "compteur" ? `<div class="deux"><div class="champ"><label for="ed-obj">Objectif</label><input type="number" id="ed-obj" min="1" max="10000" value="${e.objectif || 10}" inputmode="numeric"></div>
      <div class="champ"><label for="ed-unite">Unité</label><input type="text" id="ed-unite" value="${esc(e.unite || "")}" maxlength="12" placeholder="pages"></div></div>
      <div class="champ"><label for="ed-pas">Ajout à chaque appui</label><input type="number" id="ed-pas" min="1" max="1000" value="${e.pas || 1}" inputmode="numeric"></div>` : ""}`}
    <div class="champ"><span class="lab">Jours</span><div class="puces">${JOURS_COURTS.map((x, i) =>
      `<button class="puce ${e.jours.includes(i) ? "on" : ""}" data-a="ed-jour" data-v="${i}" aria-pressed="${e.jours.includes(i)}" aria-label="${JOURS_NOMS[i]}" style="min-width:40px">${x}</button>`).join("")}</div>
      <div class="puces"><button class="lien-bouton" data-a="ed-jours" data-v="tous">Tous les jours</button><button class="lien-bouton" data-a="ed-jours" data-v="semaine">En semaine</button><button class="lien-bouton" data-a="ed-jours" data-v="weekend">Le week-end</button></div></div>
    <div class="champ"><span class="lab">Moment</span><div class="puces">${Object.entries(MOMENTS).map(([k, t]) =>
      `<button class="puce ${e.moment === k ? "on" : ""}" data-a="ed-moment" data-v="${k}" aria-pressed="${e.moment === k}">${t}</button>`).join("")}</div></div>
    <div class="champ"><span class="lab">Icône</span><div class="grille-icones">${ICONES_QUETE.map(n =>
      `<button class="${e.icone === n ? "on" : ""}" data-a="ed-icone" data-v="${n}" aria-label="Icône ${n.replace("_", " ")}" aria-pressed="${e.icone === n}">${ic(n, e.icone === n ? (CATS[e.cat] || CATS.savoir).c : "var(--doux)", 22)}</button>`).join("")}</div></div>
    <p class="note" id="ed-erreur" style="margin:0;color:var(--rouge)" hidden></p>
    <div class="rangee"><button class="btn-or" data-a="ed-enregistrer" style="flex:1">Enregistrer</button><button class="btn" data-a="fermer-editeur">Annuler</button></div>
    ${e.id ? (CONFIRMER && CONFIRMER.type === "suppr" ? `<div class="rangee"><button class="btn danger" data-a="ed-supprimer-ok" style="flex:1">Supprimer définitivement</button><button class="btn" data-a="annuler-ed">Garder</button></div>`
      : `<button class="btn danger" data-a="ed-supprimer">Supprimer cette quête</button>`) : ""}
  </div></div>`;
}
function lireEditeur() {
  const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if (v("ed-nom") != null) EDITION.nom = v("ed-nom");
  if (v("ed-detail") != null) EDITION.detail = v("ed-detail");
  if (v("ed-obj") != null) EDITION.objectif = Math.max(1, parseInt(v("ed-obj"), 10) || 1);
  if (v("ed-unite") != null) EDITION.unite = v("ed-unite");
  if (v("ed-pas") != null) EDITION.pas = Math.max(1, parseInt(v("ed-pas"), 10) || 1);
  if (v("ed-contenu") != null) appliquerContenu(v("ed-contenu"));
}
function appliquerContenu(c) {
  const e = EDITION;
  if (c === e.contenu) return;
  e.contenu = c;
  if (c === "lecon") Object.assign(e, { type: "compteur", objectif: Math.min(e.objectif || 3, 20) || 3, unite: "leçons", pas: 1 });
  if (c === "chapelet") Object.assign(e, { type: "compteur", objectif: 1, unite: "dizaine", pas: 1 });
  if (c === "lecture" && e.type !== "compteur") Object.assign(e, { type: "compteur", objectif: 20, unite: "pages", pas: 5 });
}
function fermerEditeur() { EDITION = null; CONFIRMER = null; const ed = document.getElementById("editeur"); if (ed) ed.remove(); rendre(); }
function enregistrerEditeur() {
  lireEditeur();
  const e = EDITION, err = document.getElementById("ed-erreur");
  e.nom = (e.nom || "").trim();
  if (!e.nom) { err.textContent = "Donne un nom à la quête."; err.hidden = false; return; }
  if (!e.jours.length) { err.textContent = "Choisis au moins un jour."; err.hidden = false; return; }
  if (e.contenu === "chapelet") e.objectif = Math.min(5, e.objectif || 1);
  if (e.contenu === "chapelet") e.unite = e.objectif > 1 ? "dizaines" : "dizaine";
  e.jours.sort();
  if (e.id) { const i = S.quetes.findIndex(q => q.id === e.id); S.quetes[i] = e; }
  else { e.id = "q" + Date.now().toString(36); S.quetes.push(e); }
  sauver();
  fermerEditeur();
  toast("Quête enregistrée", e.nom);
}

// ------------------------------------------------------------------ sauvegarde
function exporter() {
  const texte = JSON.stringify(S);
  SAUVEGARDE_TXT = texte;
  try {
    const url = URL.createObjectURL(new Blob([texte], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "mes-quetes-" + aujourdhui() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { /* le texte reste affiché pour être copié */ }
  rendre();
}
function preparerImport(texte) {
  try {
    const s = JSON.parse(texte);
    if (!valide(s)) throw new Error();
    CONFIRMER = { type: "import", donnees: completer(s) };
    IMPORT_MSG = `Sauvegarde lue : ${Object.keys(s.jours).length} jour(s) d'historique, ${s.quetes.length} quête(s).`;
  } catch (e) { CONFIRMER = null; IMPORT_MSG = "Ce texte n'est pas une sauvegarde de Mes Quêtes."; }
  rendre();
}

// ------------------------------------------------------------------ événements
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === "fermer-editeur-fond") { if (ev.target === el) fermerEditeur(); return; }
  if (a === "fermer-feuille-fond") { if (ev.target === el) fermerFeuille(); return; }
  switch (a) {
    case "vue": VUE = el.dataset.v; EDITION = null; CONFIRMER = null; IMPORT_MSG = ""; rendre(); scrollTo(0, 0); break;
    case "basculer": basculer(id, ev); break;
    case "plus": compter(id, 1, ev); break;
    case "moins": compter(id, -1, ev); break;
    case "basculer-jour": basculer(id, ev, JOUR_SEL); break;
    case "ouvrir": ouvrirFeuille(id); break;
    case "fermer-feuille": fermerFeuille(); break;
    case "valider-feuille": { const j = jour(aujourdhui()); if (!j.gains[id]) basculer(id, ev); break; }
    case "minuteur": lancerMinuteur(Number(el.dataset.s), el.dataset.l); break;
    case "stop-minuteur": arreterMinuteur(); break;
    case "tour": { const j = jour(aujourdhui()); j.seance = j.seance || {}; j.seance[el.dataset.c] = !j.seance[el.dataset.c]; sauver(); rendreFeuille(); break; }
    case "lecon-suivante": nouvelleLecon(aujourdhui()); sauver(); rendreFeuille(); setTimeout(() => { const i = document.getElementById("reponse"); if (i) i.focus(); }, 50); break;
    case "chapelet-debut": { const j = jour(aujourdhui()); j.chapelet = j.chapelet || { d: 0, ave: 0 }; j.chapelet.debut = true; sauver(); rendreFeuille(); break; }
    case "ave": { const j = jour(aujourdhui()); j.chapelet = j.chapelet || { d: 0, ave: 0, debut: true }; if (j.chapelet.ave < 10) j.chapelet.ave++; if (j.chapelet.ave === 10) son("quete"); sauver(); rendreFeuille(); break; }
    case "dizaine-finie": {
      const j = jour(aujourdhui()), q = queteId(id);
      memoriser();
      j.q[id] = (Number(j.q[id]) || 0) + 1;
      j.chapelet = { d: j.q[id], ave: 0, debut: true };
      if (estFaite(q, j.q[id]) && !j.gains[id]) { gagner(j, id, q); flotte(ev, "+" + q.xp + " XP"); son("quete"); }
      if (!j.liste.includes(id)) j.liste.push(id);
      apres(); break;
    }
    case "surprise": surpriseFaite(ev); break;
    case "changer-surprise": changerSurprise(); break;
    case "coffre": ouvrirCoffre(); break;
    case "fermer-celebration": el.closest(".celebration").remove(); break;
    case "mois": { const [y, m] = MOIS_VU.split("-").map(Number); const d = new Date(y, m - 1 + Number(el.dataset.s), 1); MOIS_VU = iso(d).slice(0, 7); rendre(); break; }
    case "jour": JOUR_SEL = el.dataset.k; rendre(); break;
    case "humeur": case "energie": { const j = jour(JOUR_SEL); j[a] = j[a] === el.dataset.h ? "" : el.dataset.h; sauver(); rendre(); break; }
    case "nouvelle": ouvrirEditeur(null); break;
    case "modifier": ouvrirEditeur(id); break;
    case "activer": { const q = queteId(id); q.actif = !q.actif; sauver(); rendre(); break; }
    case "monter": { const i = Number(el.dataset.i); if (i > 0) { [S.quetes[i - 1], S.quetes[i]] = [S.quetes[i], S.quetes[i - 1]]; sauver(); rendre(); } break; }
    case "matiere": { const m = el.dataset.v, ms = S.params.matieres; S.params.matieres = ms.includes(m) ? ms.filter(x => x !== m) : [...ms, m]; if (!S.params.matieres.length) S.params.matieres = [m]; sauver(); rendre(); break; }
    case "param-surprise": S.params.surprise = !S.params.surprise; sauver(); rendre(); break;
    case "param-son": S.params.son = !S.params.son; sauver(); rendre(); if (S.params.son) son("quete"); break;
    case "exporter": exporter(); break;
    case "copier": {
      const repli = () => { const c = document.getElementById("txt-sauvegarde"); const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné", "Copie-le avec le menu de ton appareil."); };
      try { navigator.clipboard.writeText(SAUVEGARDE_TXT).then(() => toast("Sauvegarde copiée", "Colle-la dans une note ou un e-mail."), repli); } catch (e) { repli(); }
      break;
    }
    case "importer-texte": preparerImport(document.getElementById("coller-import").value); break;
    case "confirmer-import": S = CONFIRMER.donnees; S.penalitesVues = Math.max(S.penalitesVues, stats().penalites.length); CONFIRMER = null; IMPORT_MSG = "Données restaurées."; SAUVEGARDE_TXT = ""; sauver(); rendre(); break;
    case "reset": CONFIRMER = { type: "reset" }; rendre(); break;
    case "confirmer-reset": S = etatInitial(); CONFIRMER = null; SAUVEGARDE_TXT = ""; IMPORT_MSG = ""; sauver(); VUE = "quetes"; rendre(); break;
    case "annuler": CONFIRMER = null; IMPORT_MSG = ""; rendre(); break;
    // éditeur
    case "annuler-ed": CONFIRMER = null; rendreEditeur(); break;
    case "ed-cat": lireEditeur(); EDITION.cat = el.dataset.v; rendreEditeur(); break;
    case "ed-xp": lireEditeur(); EDITION.xp = Number(el.dataset.v); rendreEditeur(); break;
    case "ed-type": lireEditeur(); EDITION.type = el.dataset.v; rendreEditeur(); break;
    case "ed-moment": lireEditeur(); EDITION.moment = el.dataset.v; rendreEditeur(); break;
    case "ed-icone": lireEditeur(); EDITION.icone = el.dataset.v; rendreEditeur(); break;
    case "ed-jour": { lireEditeur(); const i = Number(el.dataset.v), js = EDITION.jours; EDITION.jours = js.includes(i) ? js.filter(x => x !== i) : [...js, i]; rendreEditeur(); break; }
    case "ed-jours": lireEditeur(); EDITION.jours = { tous: TOUS.slice(), semaine: [0, 1, 2, 3, 4], weekend: [5, 6] }[el.dataset.v]; rendreEditeur(); break;
    case "ed-enregistrer": enregistrerEditeur(); break;
    case "fermer-editeur": fermerEditeur(); break;
    case "ed-supprimer": lireEditeur(); CONFIRMER = { type: "suppr" }; rendreEditeur(); break;
    case "ed-supprimer-ok": S.quetes = S.quetes.filter(q => q.id !== EDITION.id); sauver(); fermerEditeur(); break;
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target;
  if (f.dataset.form === "lecon") {
    ev.preventDefault();
    verifierLecon(f.dataset.id, document.getElementById("reponse").value, { target: f.querySelector("button") });
    const i = document.getElementById("reponse");
    if (i) i.focus();
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "note-jour") { jour(t.dataset.k).note = t.value; sauver(); }
  else if (t.id === "nom-heros") { S.nom = t.value.trim(); sauver(); }
  else if (t.id === "reponse") { const j = jour(aujourdhui()); if (j.lecon) j.lecon.saisie = t.value; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "seuil") { S.params.seuil = Number(t.value); sauver(); }
  else if (t.id === "penalite") { S.params.penalite = t.value; sauver(); }
  else if (t.id === "debut") { S.params.debut = Number(t.value); sauver(); }
  else if (t.id === "ed-contenu") { lireEditeur(); rendreEditeur(); }
  else if (t.id === "fichier-import" && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => preparerImport(String(r.result));
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") {
    const c = document.querySelector(".celebration");
    if (c) c.remove(); else if (EDITION) fermerEditeur(); else if (FEUILLE) fermerFeuille();
  }
});
// changement de jour pendant que l'app est ouverte
let dernierJour = aujourdhui();
function verifierJour() { if (aujourdhui() !== dernierJour) { dernierJour = aujourdhui(); JOUR_SEL = null; MOIS_VU = null; if (FEUILLE) fermerFeuille(); rendre(); annoncerPenalites(); } }
document.addEventListener("visibilitychange", () => { if (!document.hidden) verifierJour(); });
setInterval(verifierJour, 60000);

// premier lancement : les jours passés avant l'installation ne comptent pas
if (!S.penalitesVues) S.penalitesVues = 0;
sauver();
rendre();
annoncerPenalites();
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:" && !/claude|anthropic/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

</script>
</body>
</html>
